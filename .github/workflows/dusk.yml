name: Dusk

on: [push]

jobs:
  dusk:
    runs-on: ubuntu-latest
    env:
      # Must match DB_DATABASE in .env.dusk.testing — the env file `php artisan dusk`
      # swaps in for the test run (APP_ENV=testing + that file existing triggers the swap).
      DB_DATABASE: povcityguide_testing
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_mysql, bcmath, json, curl
          tools: composer

      - name: Prepare The Environment
        # Dusk forces .env.dusk.testing for the test process, so the served app must use the
        # SAME file — otherwise the browser hits one database while the tests seed another.
        # That file leaves APP_URL commented out; point it at the server we start below.
        run: |
          echo "APP_URL=http://127.0.0.1:8000" >> .env.dusk.testing
          cp .env.dusk.testing .env

      - name: Create Database
        run: |
          sudo systemctl start mysql
          mysql --user="root" --password="root" -e "CREATE DATABASE \`${{ env.DB_DATABASE }}\` character set UTF8mb4 collate utf8mb4_bin;"

      - name: Prepare composer auth
        run: composer config http-basic.backpackforlaravel.com missionaryventures41786027 kaUk0ykBNtYG --global

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Create Storage Link
        run: php artisan storage:link --quiet

      - name: Reset Basset Cache Map
        # storage/basset/.basset is committed, but the internalized asset files it points
        # at are not. In production mode Basset trusts that map and emits <script src> URLs
        # for files that don't exist on the runner — notably @bassetBlock assets like the
        # Tabler admin menu, which 403 and fail the console-error assertion. Dropping the
        # stale map makes Basset re-internalize (or inline) each asset on first render.
        run: rm -f storage/basset/.basset

      - name: Run Migrations
        # Gives the server a populated DB so the readiness check gets a 200. DuskTestCase
        # re-runs migrate:fresh --seed once when the suite starts (its own fresh data).
        run: php artisan migrate:fresh --seed --force

      - name: Upgrade ChromeDriver
        run: php artisan dusk:chrome-driver --detect

      - name: Start Application Server
        run: php artisan serve --host=127.0.0.1 --port=8000 --no-reload &

      - name: Wait For Application Server
        run: |
          for i in $(seq 1 30); do
            if curl -sSf http://127.0.0.1:8000 > /dev/null; then
              echo "Server is up."
              exit 0
            fi
            sleep 1
          done
          echo "Application server did not start in time." >&2
          exit 1

      - name: Run Dusk Tests
        # `php artisan dusk` is required (not raw phpunit): it putenvs .env.dusk.testing into
        # the real environment so the PHPUnit child inherits the correct APP_URL/DB, instead
        # of Laravel loading .env.testing (sqlite + APP_URL=localhost) because of APP_ENV.
        #
        # The wrapper can still report a spurious non-zero exit — it runs PHPUnit as a child
        # process and rethrows a ProcessSignaledException raised during that child's shutdown,
        # which Laravel's console turns into exit 1 even when every test passed. So we decide
        # the step's result from PHPUnit's JUnit report (real failures/errors), not the code.
        run: |
          set +e
          php artisan dusk --without-tty --log-junit storage/dusk-junit.xml
          echo "php artisan dusk raw exit code: $?"
          php -r '$x=@simplexml_load_file("storage/dusk-junit.xml"); if($x===false){fwrite(STDERR,"no JUnit report — treating as failure\n");exit(2);} $n=count($x->xpath("//failure"))+count($x->xpath("//error")); fwrite(STDERR,"JUnit failures+errors: $n\n"); exit($n>0?1:0);'
          exit $?

      - name: Upload Dusk Output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-output
          path: |
            tests/Output/Browser/screenshots
            tests/Output/Browser/console
            tests/Output/Browser/source
          if-no-files-found: ignore
          retention-days: 7
